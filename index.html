<!doctype html>
<html lang="fr" data-theme="rose" data-motion="on">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07050d">
  <title>PlayZone – Jeux en ligne gratuits</title>
  <meta name="description" content="PlayZone : des jeux en ligne gratuits, sans téléchargement, et des outils pour étudier.">
  <!-- AdSense : le script est injecté automatiquement par js/ads.js une fois js/config.js rempli -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* Applique le thème enregistré avant l'affichage (évite un flash de couleur). */
    try {
      var t = JSON.parse(localStorage.getItem("pz:theme") || "null");
      if (t && t.color) document.documentElement.dataset.theme = t.color;
      if (t && t.motion === false) document.documentElement.dataset.motion = "off";
    } catch (e) {}
  </script>
</head>
<body>
  <!-- Lignes néon en arrière-plan -->
  <svg class="bg-lines" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <path id="l1" d="M-60 230 C180 110 270 400 470 300 S710 70 870 260 S1110 570 1310 420 S1570 210 1690 340"/>
      <path id="l2" d="M-50 650 C200 540 310 830 570 720 S850 470 1050 640 S1370 890 1710 700"/>
      <path id="l3" d="M1180 120 C1320 30 1510 110 1485 265 C1460 410 1280 430 1210 335 C1150 250 1105 170 1180 120Z"/>
      <path id="l4" d="M130 430 C40 380 15 530 110 550 C205 570 250 455 185 412 C162 396 143 402 130 430Z"/>
    </defs>
    <g class="glow"><use href="#l1"/><use href="#l2"/><use href="#l3"/><use href="#l4"/></g>
    <g class="core"><use href="#l1"/><use href="#l2"/><use href="#l3"/><use href="#l4"/></g>
  </svg>

  <header class="pill-nav" id="nav"></header>
  <div class="theme-pop" id="theme-pop" hidden></div>

  <main class="view" id="view" tabindex="-1"></main>

  <!-- Lecteur de jeu -->
  <div class="player" id="player" hidden>
    <div class="player-bar">
      <button class="pbtn" id="back" type="button"></button>
      <strong id="player-title"></strong>
      <div class="player-actions">
        <button class="pbtn icon" id="p-fav" type="button" aria-label="Ajouter aux favoris" aria-pressed="false"></button>
        <button class="pbtn icon" id="p-reload" type="button" aria-label="Recharger le jeu"></button>
        <button class="pbtn icon" id="fs" type="button" aria-label="Plein écran"></button>
      </div>
    </div>
    <div class="ad-slot" data-ad="player"></div>
    <iframe id="frame" title="Jeu" allow="fullscreen; gamepad; autoplay" sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-popups"></iframe>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/ads.js"></script>
  <script src="js/core.js"></script>
  <script src="js/calc-engine.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/tool-calc.js"></script>
  <script src="js/tool-chat.js"></script>
  <script src="js/tool-misc.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
